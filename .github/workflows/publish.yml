name: Publish

on:
  push:
    branches:
      - main

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Package
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.packageArtifactName }}

      - name: NuGet Login
        uses: NuGet/login@v1
        id: login
        with:
          user: yusuke.masuda

      - name: Push Package
        run: |
          dotnet nuget push "./*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create Git-Tag
        run: |
          git tag "${{ needs.build.outputs.tagName }}"
          git push origin "${{ needs.build.outputs.tagName }}"
