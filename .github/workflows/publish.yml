name: Publish

on:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build

    runs-on: ubuntu-latest

    steps:

      - name: Download Package
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.packageArtifactName }}

      - name: List Files
        run: |
          find .
