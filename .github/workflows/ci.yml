name: CI

on:
  push:
    branches:
      - develop
      - 'feature/**'

  pull_request:
    branches:
      - develop
      - main

jobs:
  build:

    name: Build and Test

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build
