name: Build

env:
  LINE_COVERAGE_THRESHOLD: 80
  BRANCH_COVERAGE_THRESHOLD: 70

on:
  workflow_call:
    outputs:
      semVer:
        description: Semantic version
        value: ${{ jobs.build.outputs.semVer }}
      packageArtifactName:
        description: Package artifact name
        value: ${{ jobs.build.outputs.packageArtifactName }}
      tagName:
        description: Git tag name
        value: v${{ jobs.build.outputs.semVer }}

jobs:
  build:

    name: Build, Test and Coverage

    runs-on: ubuntu-latest

    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
      packageArtifactName: nuget-package-${{ steps.gitversion.outputs.semVer }}
      tagName: v${{ steps.gitversion.outputs.semVer }}

    steps:

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4

      - name: Display Version
        run: |
          echo "Version now building: ${{ steps.gitversion.outputs.semVer }}"
          echo "majorMinorPatch=${{ steps.gitversion.outputs.majorMinorPatch }}"
          echo "semVer=${{ steps.gitversion.outputs.semVer }}"
          echo "fullSemVer=${{ steps.gitversion.outputs.fullSemVer }}"
          echo "nuGetVersion=${{ steps.gitversion.outputs.nuGetVersion }}"
          echo "nuGetVersionV2=${{ steps.gitversion.outputs.nuGetVersionV2 }}"

      - name: Restore
        run: |
          dotnet restore

      - name: Build
        run: |
          dotnet build \
            --configuration Release \
            --no-restore \
            /p:Version=${{ steps.gitversion.outputs.semVer }} \
            /p:PackageVersion=${{ steps.gitversion.outputs.semVer }} \
            /p:AssemblyVersion=${{ steps.gitversion.outputs.assemblySemVer }} \
            /p:FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }} \
            /p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}

      - name: Test
        run: |
          dotnet test \
            --configuration Release \
            --no-build \
            --collect:"XPlat Code Coverage"

      - name: Install ReportGenerator
        run: |
          dotnet tool install \
            --global dotnet-reportgenerator-globaltool

      - name: Generate Coverage Report
        run: |
          reportgenerator \
            -reports:**/coverage.cobertura.xml \
            -targetdir:coveragereport \
            "-reporttypes:Html;MarkdownSummary"

      - name: Validate Coverage
        shell: pwsh
        run: |
          $hasError = $false

          $coverageFiles = Get-ChildItem -Filter coverage.cobertura.xml -Recurse
          if ($coverageFiles.Count -eq 0)
          {
              Write-Error "No coverage.cobertura.xml files found."
              exit 1
          }

          foreach ($file in $coverageFiles)
          {
              Write-Host "Coverage file: $($file.FullName)"
              [xml]$coverage = Get-Content $file.FullName

              $lineRate = [math]::Round([double]$coverage.coverage.'line-rate' * 100, 2)
              $branchRate = [math]::Round([double]$coverage.coverage.'branch-rate' * 100, 2)

              Write-Host "Line Coverage   : $lineRate%"
              Write-Host "Branch Coverage : $branchRate%"

              if ($lineRate -lt $env:LINE_COVERAGE_THRESHOLD)
              {
                  Write-Error(
                    "Line coverage threshold not met. " +
                    "Required: $env:LINE_COVERAGE_THRESHOLD%, " +
                    "Actual: $lineRate%, " +
                    "File: $($file.FullName)")

                  $hasError = $true
              }

              if ($branchRate -lt $env:BRANCH_COVERAGE_THRESHOLD)
              {
                  Write-Error(
                    "Branch coverage threshold not met. " +
                    "Required: $env:BRANCH_COVERAGE_THRESHOLD%, " +
                    "Actual: $branchRate%, " +
                    "File: $($file.FullName)")

                  $hasError = $true
              }
          }

          if ($hasError)
          {
              exit 1
          }

          Write-Host "Coverage validation passed."

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coveragereport
          if-no-files-found: ignore

      - name: Pack
        run: |
          dotnet pack \
            --configuration Release \
            --no-build \
            -o artifacts/packages \
            /p:Version=${{ steps.gitversion.outputs.semVer }} \
            /p:PackageVersion=${{ steps.gitversion.outputs.semVer }}
      
      - name: Upload NuGet Package
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package-${{ steps.gitversion.outputs.semVer }}
          path: artifacts/packages/**/*.nupkg
